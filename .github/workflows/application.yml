name: Application Always Free deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: deploy-application
        options: [deploy-application, build-backup-only]
        description: Deploy the application or only publish the backup tool image.
      deployment_mode:
        type: choice
        default: restore-existing
        options: [restore-existing, initialize]
        description: Existing initialized database or explicitly empty installation.
      readiness_mode:
        type: choice
        default: public
        options: [public, internal]
        description: Internal mode leaves maintenance jobs suspended until public verification.

permissions:
  contents: read

concurrency:
  group: always-free-maintenance
  cancel-in-progress: false

jobs:
  container:
    if: inputs.operation != 'build-backup-only'
    name: Build and publish release image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_reference: ${{ steps.image.outputs.reference }}
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image reference
        id: image
        shell: bash
        run: echo "reference=${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Verify anonymous GHCR pull access
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null
          if ! docker buildx imagetools inspect "${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >/dev/null; then
            echo 'The GHCR package is private. Make it public in GitHub Packages, then rerun this workflow.' >&2
            exit 1
          fi

  deploy:
    name: Apply schema changes and deploy production
    if: github.ref == 'refs/heads/master'
    needs: container
    runs-on: ubuntu-latest
    environment: always-free
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_MODE: ${{ inputs.deployment_mode || 'restore-existing' }}
      READINESS_MODE: ${{ inputs.readiness_mode || 'public' }}
      IMAGE_REFERENCE: ${{ needs.container.outputs.image_reference }}
      RELEASE_ID: ${{ github.sha }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
      INITIAL_HOUSEHOLD_NAME: ${{ secrets.INITIAL_HOUSEHOLD_NAME }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/load-oci-target
        with:
          configuration: ${{ secrets.OCI_TARGET_CONFIG }}
      - uses: ./.github/actions/setup-oci-wif
        with:
          domain-url: ${{ env.OCI_WIF_DOMAIN_URL }}
          client-id: ${{ env.OCI_WIF_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_WIF_CLIENT_SECRET }}
          audience: ${{ env.OCI_WIF_AUDIENCE }}
          service-user-ocid: ${{ env.OCI_WIF_SERVICE_USER_OCID }}
          tenancy-ocid: ${{ env.OCI_TENANCY_OCID }}
          region: ${{ env.OCI_REGION }}
      - name: Create WIF-aware OKE kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_COMPARTMENT_OCID"
          test "$(oci os ns get --query data --raw-output)" = "$OCI_OBJECT_NAMESPACE"
          cluster_id="$OCI_CLUSTER_OCID"
          oci ce cluster get --cluster-id "$cluster_id" | python3 -c '
          import json, os, sys
          c = json.load(sys.stdin)["data"]
          assert c["compartment-id"] == os.environ["OCI_COMPARTMENT_OCID"]
          assert c["type"] == "BASIC_CLUSTER" and c["lifecycle-state"] == "ACTIVE"
          '
          kubeconfig_path="${RUNNER_TEMP}/oke-kubeconfig"
          oci ce cluster create-kubeconfig \
            --cluster-id "$cluster_id" \
            --file "$kubeconfig_path" \
            --region "$OCI_REGION" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT \
            --with-auth-context \
            --auth security_token \
            --profile DEFAULT
          echo "KUBECONFIG=${kubeconfig_path}" >> "$GITHUB_ENV"
      - name: Run schema changes, initialization, and rollout
        run: ./scripts/deploy-application.sh
      - name: Record release summary
        if: success()
        shell: bash
        run: |
          {
            echo '### Production application deployed'
            echo '- Image: `${{ needs.container.outputs.image_reference }}`'
            echo '- Migrations: applied in OKE before rollout'
            echo '- Readiness: passed through public HTTPS endpoint'
          } >> "$GITHUB_STEP_SUMMARY"

  backup-image:
    name: Build and publish PostgreSQL backup image
    if: inputs.operation == 'build-backup-only' && (github.ref == 'refs/heads/master')
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: deploy/backup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-backup:${{ github.sha }}
      - name: Verify public pull and record image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-backup@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null
          docker buildx imagetools inspect "$IMAGE" >/dev/null || { echo 'Make the backup package public, then rerun.' >&2; exit 1; }
          echo "Set OCI_BACKUP_IMAGE in always-free to: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
