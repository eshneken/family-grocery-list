name: Verify always-free OCI federation

on:
  workflow_dispatch:
    inputs:
      check_backup_health:
        description: Read-only production backup-health check
        type: boolean
        default: false

concurrency:
  group: always-free-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    name: Exchange GitHub OIDC token for OCI credentials
    runs-on: ubuntu-latest
    environment: always-free
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/load-oci-target
        with:
          configuration: ${{ secrets.OCI_TARGET_CONFIG }}
      - uses: ./.github/actions/setup-oci-wif
        id: oci
        with:
          domain-url: ${{ env.OCI_WIF_DOMAIN_URL }}
          client-id: ${{ env.OCI_WIF_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_WIF_CLIENT_SECRET }}
          audience: ${{ env.OCI_WIF_AUDIENCE }}
          service-user-ocid: ${{ env.OCI_WIF_SERVICE_USER_OCID }}
          tenancy-ocid: ${{ env.OCI_TENANCY_OCID }}
          region: ${{ env.OCI_REGION }}
      - name: Record verification
        env:
          OCI_NAMESPACE: ${{ steps.oci.outputs.namespace }}
        shell: bash
        run: |
          set -euo pipefail
          test "$OCI_NAMESPACE" = "$OCI_OBJECT_NAMESPACE"
          {
            echo '### Always-free OCI federation verification passed'
            echo 'Approved private target identity verified.'
            echo 'GitHub token exchange and namespace discovery passed. No infrastructure was provisioned.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify backup health
        if: inputs.check_backup_health
        shell: bash
        run: |
          set -euo pipefail
          oci ce cluster create-kubeconfig \
            --cluster-id "$OCI_CLUSTER_OCID" \
            --file "$RUNNER_TEMP/oke-kubeconfig" --region us-ashburn-1 \
            --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT \
            --with-auth-context --auth security_token --profile DEFAULT
          context="$(kubectl --kubeconfig "$RUNNER_TEMP/oke-kubeconfig" config current-context)"
          python3 -B scripts/check-backup-health.py \
            --kubeconfig "$RUNNER_TEMP/oke-kubeconfig" --context "$context" \
            --oci-profile DEFAULT --oci-auth security_token
