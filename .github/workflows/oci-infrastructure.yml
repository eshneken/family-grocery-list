name: OCI Always Free infrastructure
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Review/apply one stage. Local administrator bootstrap must already be complete.
        required: true
        type: choice
        options: [production, cluster-foundation]
      operation:
        description: Plan first; apply only after reviewing this commit's plan.
        required: true
        type: choice
        options: [plan, apply]
      retry_nodepool_only:
        description: Reject all changes except creating the missing single A1 node pool.
        type: boolean
        default: false
      confirm_apply_sha:
        description: Full reviewed commit SHA, required only for apply.
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: always-free-maintenance
  cancel-in-progress: false
jobs:
  infrastructure:
    if: github.ref == 'refs/heads/codex/oci-always-free' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: always-free
    timeout-minutes: 120
    env:
      TF_VAR_app_hostname: ${{ vars.OCI_APP_HOSTNAME }}
      TF_VAR_oke_kubernetes_version: ${{ vars.OCI_OKE_KUBERNETES_VERSION }}
      TF_VAR_node_availability_domain: ${{ vars.OCI_NODE_AVAILABILITY_DOMAIN }}
      TF_VAR_node_image_id: ${{ vars.OCI_NODE_IMAGE_ID }}
      TF_VAR_caddy_acme_email: ${{ vars.CADDY_ACME_EMAIL }}
      TF_VAR_backup_image: ${{ vars.OCI_BACKUP_IMAGE }}
      TF_VAR_backup_age_recipient: ${{ vars.OCI_BACKUP_AGE_RECIPIENT }}
      ALWAYS_FREE_NODEPOOL_RETRY_ONLY: ${{ inputs.retry_nodepool_only }}
      CONFIRM_APPLY_SHA: ${{ inputs.confirm_apply_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false
      - uses: ./.github/actions/setup-oci-wif
        id: oci
        with:
          domain-url: ${{ vars.OCI_WIF_DOMAIN_URL }}
          client-id: ${{ vars.OCI_WIF_CLIENT_ID }}
          client-secret: ${{ secrets.OCI_WIF_CLIENT_SECRET }}
          audience: ${{ vars.OCI_WIF_AUDIENCE }}
          service-user-ocid: ${{ vars.OCI_WIF_SERVICE_USER_OCID }}
          tenancy-ocid: ${{ vars.OCI_TENANCY_OCID }}
          region: ${{ vars.OCI_REGION }}
      - name: Read target bootstrap outputs
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.oci.outputs.namespace }}' = iddiywf0v4j6
          umask 077
          oci os object get --namespace-name iddiywf0v4j6 --bucket-name grocery-always-free-tfstate --name bootstrap/terraform.tfstate --file "$RUNNER_TEMP/bootstrap-state.json" >/dev/null
          python3 - <<'PY'
          import json, os
          state = json.load(open(os.environ['RUNNER_TEMP'] + '/bootstrap-state.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for name in ['vault_id', 'vault_key_id']:
                  env.write('TF_VAR_' + name + '=' + state['outputs'][name]['value'] + '\n')
          PY
      - name: Create foundation kubeconfig
        if: inputs.stage == 'cluster-foundation'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          oci os object get --namespace-name iddiywf0v4j6 --bucket-name grocery-always-free-tfstate --name production/terraform.tfstate --file "$RUNNER_TEMP/production-state.json" >/dev/null
          cluster_id="$(jq -r '.outputs.cluster_id.value' "$RUNNER_TEMP/production-state.json")"
          oci ce cluster create-kubeconfig --cluster-id "$cluster_id" --file "$RUNNER_TEMP/kubeconfig" --region us-ashburn-1 --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT --with-auth-context --auth security_token --profile DEFAULT
          echo "TF_VAR_kubeconfig_path=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Plan or apply reviewed stage
        env:
          STAGE: ${{ inputs.stage }}
          OPERATION: ${{ inputs.operation }}
          ALWAYS_FREE_WORK_DIR: ${{ runner.temp }}/always-free-terraform
        run: ./scripts/always-free-terraform.sh "$STAGE" "$OPERATION"
